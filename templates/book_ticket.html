<!DOCTYPE html>
<html>

<head>

    <title>Book Ticket</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">

</head>

<body class="container mt-5">

    <h1 class="mb-4">
        Book Ticket
    </h1>

    <div class="card p-4">

        <h3>
            {{ bus["bus_name"] }}
        </h3>

        <p>
            {{ bus["source"] }}
            →
            {{ bus["destination"] }}
        </p>

        <p>
            Departure:
            {{ bus["departure_time"] }}
        </p>

        <p>
            Available Seats:
            {{ bus["available_seats"] }}
        </p>

        {% if success %}

        <div class="alert alert-success">

            {{ success }}

        </div>

        {% endif %}

        {% if error %}

        <div class="alert alert-danger">

            {{ error }}

        </div>

        {% endif %}

        {% if not success %}

        <form
        action="/confirm-booking/{{ bus['id'] }}"
        method="POST">

            <input
            type="number"
            name="seats_booked"
            placeholder="Enter Seats"
            class="form-control mb-3">

            <button class="btn btn-success">

                Confirm Booking

            </button>

        </form>

        {% endif %}

    </div>

</body>

</html>
