<h1>Update Bus</h1>

<form method="POST">

    <input type="text"
           name="bus_name"
           value="{{ bus.bus_name }}">

    <input type="text"
           name="source"
           value="{{ bus.source }}">

    <input type="text"
           name="destination"
           value="{{ bus.destination }}">

    <input type="number"
       name="available_seats"
       value="{{ bus['available_seats'] }}">

    <button type="submit">
        Update Bus
    </button>

</form>
