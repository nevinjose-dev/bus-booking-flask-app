<h1>Add Bus</h1>

<form method="POST">

    <input type="text"
           name="bus_name"
           placeholder="Bus Name">

    <input type="text"
           name="source"
           placeholder="Source">

    <input type="text"
           name="destination"
           placeholder="Destination">

    <input type="number"
       name="available_seats"
       placeholder="Available Seats">

    <button type="submit">
        Add Bus
    </button>

</form>
